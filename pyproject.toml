[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisgraph-api"
version = "0.1.0"
description = "Evidence-grounded security investigation for synthetic Atlas telemetry"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests/backend", "apps/api/tests"]
pythonpath = ["apps/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

name: Validate AegisGraph

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# Public CI never loads workstation configuration or calls a live model.
# OPENAI_API_KEY and OPENAI_MODEL are intentionally not supplied to any job.
env:
  AEGISGRAPH_LOAD_ENV: 'false'
  APP_MODE: local
  AI_PROVIDER: deterministic

jobs:
  # API/AI boundaries, PostgreSQL migrations and seed, smoke, dependency audit.
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aegisgraph
          POSTGRES_PASSWORD: demo-local-only
          POSTGRES_DB: aegisgraph
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U aegisgraph -d aegisgraph"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://aegisgraph:demo-local-only@127.0.0.1:5432/aegisgraph
      AI_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: ruff check apps/api tests/backend scripts
      - run: ruff format --check apps/api tests/backend scripts
      - run: pytest -q
      - run: alembic upgrade head
      - run: python -m aegisgraph.cli seed
      - run: python -m aegisgraph.cli evaluate
      - run: python scripts/smoke.py
      - run: pip-audit -r requirements.lock
      - name: Build Railway image and check seeded PostgreSQL from the container
        run: |
          docker build --tag aegisgraph-api .
          docker run --rm --network host --env DATABASE_URL \
            --env APP_MODE=public_demo --env AI_PROVIDER=deterministic \
            --env ALLOWED_ORIGINS=https://demo.example \
            --env ALLOWED_HOSTS=api.example,healthcheck.railway.app \
            aegisgraph-api python -m aegisgraph.cli public-check

  # Formatting, lint, types, component tests, production build, dependency audit.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  # Local SQLite workflow plus read-only PostgreSQL public demo over local HTTPS.
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aegisgraph
          POSTGRES_PASSWORD: demo-local-only
          POSTGRES_DB: aegisgraph_public_validation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U aegisgraph -d aegisgraph_public_validation"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: npm ci --prefix apps/web
      - run: node apps/web/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm run build --prefix apps/web
      - run: python scripts/prepare_e2e.py
      - run: node apps/web/node_modules/@playwright/test/cli.js test --config playwright.config.ts
      - name: Clean PostgreSQL public initialization and API boundaries
        run: python scripts/validate_public_database.py
        env:
          APP_MODE: public_demo
          DATABASE_URL: postgresql+psycopg://aegisgraph:demo-local-only@127.0.0.1:5432/aegisgraph_public_validation
          ALLOWED_ORIGINS: https://127.0.0.1:3443
          ALLOWED_HOSTS: 127.0.0.1,localhost
      - name: Public production build and HTTPS browser workflow
        run: |
          npm run build --prefix apps/web
          node apps/web/node_modules/@playwright/test/cli.js test --config playwright.public.config.ts
        env:
          APP_MODE: public_demo
          API_INTERNAL_URL: https://127.0.0.1:8443
          DATABASE_URL: postgresql+psycopg://aegisgraph:demo-local-only@127.0.0.1:5432/aegisgraph_public_validation
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            playwright-report/
            test-results/
